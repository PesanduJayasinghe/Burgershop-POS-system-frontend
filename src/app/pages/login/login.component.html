<div class="auth-shell">
    <div class="auth-card">
        <h1>Cashier Login</h1>
        <p class="hint">Use sample password: pos123</p>

        <label>Name</label>
        <input type="text" [(ngModel)]="name" placeholder="Enter cashier name" />

        <label>Password</label>
        <input type="password" [(ngModel)]="password" placeholder="Enter password" />

        @if (error) {
        <p class="error">{{ error }}</p>
        }

        <button (click)="onLogin()">Log In</button>

        <p class="switch">New cashier? <a routerLink="/signup">Create account</a></p>
    </div>
</div>
