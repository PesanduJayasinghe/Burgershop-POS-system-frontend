<div class="auth-shell">
  <div class="glass-container">
    <div class="brand-header">
      <div class="logo-circle">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 15C3 12 7.03 10 12 10C16.97 10 21 12 21 15C21 17.5 17 19 12 19C7 19 3 17.5 3 15Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5.5 10C5.5 10 5.5 5 12 5C18.5 5 18.5 10 18.5 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 12H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>BurgerPOS</h1>
      <p class="subtitle">Secure Employee Gateway</p>
    </div>

    <div class="auth-card">
      <div class="card-header">
        <h2>Sign In</h2>
        <span class="badge">Sample pass: <b>pos123</b></span>
      </div>

      <div class="form-group">
        <label for="name">Username</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <input id="name" type="text" [(ngModel)]="name" placeholder="Enter username" autocomplete="off" />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input id="password" type="password" [(ngModel)]="password" placeholder="Enter password" />
        </div>
      </div>

      <div class="error-container" *ngIf="error">
        <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <span class="error-text">{{ error }}</span>
      </div>

      <button class="btn-primary" (click)="onLogin()">
        <span>Continue to POS</span>
        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>
    </div>

  </div>
</div>
