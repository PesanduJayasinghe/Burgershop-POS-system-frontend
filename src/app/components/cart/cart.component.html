<div class="order-items-list">
    @if (orderItems.length === 0) {
    <div class="empty-order" style="display: flex; flex-direction: column; text-align: center; align-items: center;">
        <i class="fas fa-shopping-cart text-gray-300 text-4xl mb-3"></i>
        <p class="text-gray-500"><strong>No items added yet</strong></p>
        <p class="text-gray-400 text-sm"><strong>Add items from the menu</strong></p>
        <!-- From Uiverse.io by Novaxlo -->
        <div class="capybaraloader">
            <div class="capybara">
                <div class="capyhead">
                    <div class="capyear">
                        <div class="capyear2"></div>
                    </div>
                    <div class="capyear"></div>
                    <div class="capymouth">
                        <div class="capylips"></div>
                        <div class="capylips"></div>
                    </div>
                    <div class="capyeye"></div>
                    <div class="capyeye"></div>
                </div>
                <div class="capyleg"></div>
                <div class="capyleg2"></div>
                <div class="capyleg2"></div>
                <div class="capy"></div>
            </div>
            <div class="loader">
                <div class="loaderline"></div>
            </div>
        </div>
    </div>
    }


    @for (item of orderItems; track item.name + item.category; let i = $index) {
    <div class="order-item" [ngClass]="getItemClass(item.category)">
        <div class="item-info">
            <h4 class="item-name">{{ item.name }}</h4>
            <div class="card__image"><img [src]="item.image" [alt]="item.name"></div>
            <div class="item-controls">
                <button (click)="decreaseQuantity(i)" class="qty-btn" [disabled]="item.quantity < 1">-
                    <i class="fas fa-minus"></i>
                </button>
                <span class="item-qty">{{ item.quantity }}</span>
                <button (click)="increaseQuantity(i)" class="qty-btn">+
                    <i class="fas fa-plus"></i>
                </button>
            </div>
        </div>

        <div class="item-price">
            <!-- Add safe navigation and default value -->
            <div class="price-amount">LKR {{ getItemTotal(item) }}</div>
            <div class="price-unit">LKR {{ getItemPrice(item) }} each</div>
            <button (click)="removeItem(i)" class="remove-btn">Remove
                <i class="fas fa-trash-alt"></i>
            </button>
        </div>
    </div>
    }
</div>
