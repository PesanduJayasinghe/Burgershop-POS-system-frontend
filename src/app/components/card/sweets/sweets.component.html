<div class="page-content">
  <div class="sweets-scroll-container">
    @for (sweet of sweets; track sweet.id) {
      <div class="card" [class.out-of-stock]="sweet.quantity === 0">
        <div class="card__shine"></div>
        <div class="card__glow"></div>
        <div class="card__content">
          
          <!-- Admin Edit Pencil -->
          <button *ngIf="isAdmin()" class="admin-edit-btn" (click)="openEditModal(sweet, $event)" title="Edit Item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
          </button>

          <div class="card__badge" *ngIf="sweet.quantity > 0">STOCK: {{ sweet.quantity }}</div>
          <div class="card__badge out-of-stock-badge" *ngIf="sweet.quantity === 0">OUT OF STOCK</div>
          
          <div class="burger-image">
            <img [src]="sweet.image" [alt]="sweet.title" />
          </div>
          
          <div class="card__text">
            <p class="card__title">{{ sweet.title }}</p>
          </div>

          <!-- Quantity Controls -->
          <div class="quantity-controls" *ngIf="sweet.quantity > 0">
            <button (click)="decreaseQuantity(sweet)" [disabled]="(sweet.orderQuantity || 0) === 0">-</button>
            <span>{{ sweet.orderQuantity || 0 }}</span>
            <button (click)="increaseQuantity(sweet)" [disabled]="(sweet.orderQuantity || 0) >= sweet.quantity">+</button>
          </div>

          <div class="card__footer">
            <div class="card__price">{{ sweet.price }}</div>
            <button (click)="addToCart(sweet)" [disabled]="(sweet.orderQuantity || 0) === 0" *ngIf="sweet.quantity > 0">
              <div class="card__button">
                <svg height="16" width="16" viewBox="0 0 24 24">
                  <path stroke-width="2" stroke="currentColor" d="M4 12H20M12 4V20" fill="currentColor"></path>
                </svg>
              </div>
            </button>
          </div>
        </div>
      </div>
    }

    <!-- Add Item Shadow Card -->
    <div *ngIf="isAdmin()" class="card add-new-card" (click)="openAddModal()" title="Add New Product">
      <div class="card__content add-new-content">
        <div class="add-icon-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </div>
        <p class="add-new-text">Add Item</p>
      </div>
    </div>
  </div>

  <!-- Admin Edit Modal Overlay -->
  <div class="modal-overlay" *ngIf="isEditModalOpen">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Edit Sweet</h3>
        <button class="close-btn" (click)="closeEditModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Title</label>
          <input type="text" [(ngModel)]="editItem.title" placeholder="Enter title" />
        </div>
        <div class="form-group">
          <label>Price (e.g. LKR 1200.00/=)</label>
          <input type="text" [(ngModel)]="editItem.price" placeholder="Enter price format" />
        </div>
        <div class="form-group">
          <label>Stock Quantity</label>
          <input type="number" [(ngModel)]="editItem.quantity" placeholder="Enter quantity" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" (click)="closeEditModal()">Cancel</button>
        <button class="btn-primary-modal" (click)="saveEditItem()">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- Admin Add Modal Overlay -->
  <div class="modal-overlay" *ngIf="isAddModalOpen">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Add New Sweet</h3>
        <button class="close-btn" (click)="closeAddModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Title</label>
          <input type="text" [(ngModel)]="newItem.title" placeholder="e.g. Chocolate Sundae Double" />
        </div>
        <div class="form-group">
          <label>Price</label>
          <input type="text" [(ngModel)]="newItem.price" placeholder="e.g. LKR 800.00/=" />
        </div>
        <div class="form-group">
          <label>Image Name/Path (under img/Sweet/)</label>
          <input type="text" [(ngModel)]="newItem.image" placeholder="e.g. Vanilla.png" />
        </div>
        <div class="form-group">
          <label>Stock Quantity</label>
          <input type="number" [(ngModel)]="newItem.quantity" placeholder="e.g. 10" />
        </div>
        <div class="error-msg" *ngIf="addError">{{ addError }}</div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" (click)="closeAddModal()">Cancel</button>
        <button class="btn-primary-modal" (click)="saveNewItem()">Add Product</button>
      </div>
    </div>
  </div>
</div>
