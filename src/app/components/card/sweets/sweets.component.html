<!-- From Uiverse.io by SachinKumar666 --> 
<div class="page-content">
   <div class="sweets-scroll-container ">
 @for (sweet of sweets; track sweet.title) {
<div class="card">
  <div class="card__shine"></div>
  <div class="card__glow"></div>
  <div class="card__content">
   
    <div class="card__badge">NEW</div>
    <div style="" class="burger-image"> <img [src]="sweet.image" [alt]="sweet.title" /></div>
    <div class="card__text">
      <p class="card__title">{{ sweet.title }}</p>
    </div>

    
       <!-- Quantity Controls -->
          <div class="quantity-controls">
            <button (click)="decreaseQuantity(sweet)" [disabled]="sweet.quantity === 0">
              -
            </button>
            <span>{{ sweet.quantity || 0 }}</span>
            <button (click)="increaseQuantity(sweet)">
              +
            </button>
          </div>


    <div class="card__footer">
      <div class="card__price">{{ sweet.price }}</div>


      <button (click)="addToCart(sweet)" >
      <div class="card__button">
        <svg height="16" width="16" viewBox="0 0 24 24" >
          <path 
            stroke-width="2"
            stroke="currentColor"
            d="M4 12H20M12 4V20"
            fill="currentColor"
          ></path>
        </svg>
      </div>
      </button>
    </div>
  
  </div>
</div>
}
</div>
</div>
