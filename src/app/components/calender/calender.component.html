<div class="space-y-2.5 relative w-70" id="date-picker">
  <!-- Label -->
  <label class="text-black/70 text-sm">Select Date</label>

  <!-- Input Wrapper -->
  <div class="relative" >
    <div
      #inputWrapper
      (click)="toggleCalendar()"
      class="flex items-center border rounded-md py-3 px-3.5 min-w-min border-black/10 bg-white shadow-sm text-black-70 relative cursor-pointer"
    >
      <input (click)="toggleCalendar()"
        type="text"
        [value]="selectedDate | date:'dd/MM/yyyy'"
        placeholder="DD/MM/YYYY"
        readonly
        class="w-full bg-transparent outline-none text-black-70 text-base select-none"
      />
      <div
        class="bg-gray-100 h-full w-10 flex items-center justify-center rounded-md absolute right-0"
      >
        <!-- Calendar icon -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5 text-purple-500"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6.75 3v2.25M17.25 3v2.25M3 9h18M4.5 7.5v12.75A2.25 2.25 0 006.75 22.5h10.5a2.25 2.25 0 002.25-2.25V7.5"
          />
        </svg>
      </div>
    </div>

    <!-- Calendar Dropdown -->
    <div
      #calendar
      [class.hidden]="!isCalendarOpen"
      class="absolute border border-black/10 z-50 mt-1 bg-white shadow-lg rounded-md min-w-70 p-5 top-full"
    style="padding: 30px;">
      <!-- Header -->
      <div class="flex justify-between items-center mb-4">
        <button
          (click)="previousMonth()"
          type="button"
          class="p-1 border border-black/10 rounded-md hover:bg-gray-100"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4 text-black-70"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.75 19.5L8.25 12l7.5-7.5"
            />
          </svg>
        </button>

        <div
          class="text-center font-semibold text-black-80 text-base"
        >
          {{ monthNames[currentMonth] }} {{ currentYear }}
        </div>

        <button
          (click)="nextMonth()"
          type="button"
          class="p-1 border border-black/10 rounded-md hover:bg-gray-100"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4 text-black-70"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M8.25 4.5l7.5 7.5-7.5 7.5"
            />
          </svg>
        </button>
      </div>

      <!-- Weekdays -->
      <div class="grid grid-cols-7 text-center text-sm font-medium mb-2">
        <div *ngFor="let day of weekDays">{{ day }}</div>
      </div>

      <!-- Dates -->
      <div class="grid grid-cols-7 text-center text-sm">
        <ng-container *ngFor="let day of calendarDays">
          <!-- Empty cells -->
          <div *ngIf="day === 0" class="p-2 w-10 h-10"></div>
          
          <!-- Date buttons -->
          <button
            *ngIf="day !== 0"
            (click)="selectDate(day)"
            [class.bg-purple-500]="isToday(day)"
            [class.text-white]="isToday(day)"
            [class.font-semibold]="isToday(day)"
            class="p-2 w-10 h-10 rounded-md hover:bg-gray-100 transition-colors"
          >
            {{ day }}
          </button>
        </ng-container>
      </div>

      <!-- Today Button -->
      <div class="flex justify-end mt-2">
        <button
          (click)="selectToday()"
          type="button"
          class="bg-purple-500 px-2 py-1 text-white rounded-sm text-xs hover:bg-purple-600"
        >
          Today
        </button>
      </div>
    </div>
  </div>
</div>
